    <style>
        .studio-container {
            padding: 4rem 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .studio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4rem;
        }

        .back-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-family: 'Avenir Next', 'Avenir', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #d95d1e;
        }

        .photo-grid {
            column-count: 3;
            column-gap: 2rem;
        }

        @media (max-width: 1000px) {
            .photo-grid {
                column-count: 2;
            }
        }

        @media (max-width: 600px) {
            .photo-grid {
                column-count: 1;
            }
        }

        .photo-item {
            break-inside: avoid;
            margin-bottom: 2rem;
            background-color: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .photo-item:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .photo-item img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
