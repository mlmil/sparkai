                column-count: 2;
            }
        }

        @media (max-width: 600px) {
            .photo-grid {
                column-count: 1;

        }

        .photo-item {
            break-inside: avoid;
            margin-bottom: 2rem;
            background-color: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .photo-item:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .photo-item img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
